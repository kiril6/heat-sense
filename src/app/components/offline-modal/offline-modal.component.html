<div class="offline-modal" *ngIf="isOffline">
  <div class="offline-content">
    <div class="offline-icon">
      <i class="fas fa-wifi"></i>
    </div>
    <h2 class="offline-title">No Internet Connection</h2>
    <p class="offline-message">Please check your connection and try again.</p>
    <div class="offline-pulse"></div>
  </div>
</div>
